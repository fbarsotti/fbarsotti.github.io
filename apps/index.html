<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App · Francesco Barsotti</title>
  <meta name="description" content="Le app di Francesco Barsotti: privacy policy e informazioni.">
  <link rel="icon" href="assets/fblogo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --link: #B85A00;
      --bg: #F6F6F6;
      --card: #FFFFFF;
      --text: #111111;
      --muted: #6B6B6B;
      --border: rgba(0, 0, 0, 0.08);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --link: #FF9A3D;
        --bg: #0B0B0B;
        --card: #1A1A1A;
        --text: #F2F2F2;
        --muted: #A0A0A0;
        --border: rgba(255, 255, 255, 0.1);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }
    h1, h2, .eyebrow {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 16px 64px;
    }
    header { margin-bottom: 32px; }
    .logo {
      display: block;
      width: 88px;
      height: 88px;
      margin: 0 0 20px -8px;
    }
    .eyebrow {
      color: var(--link);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.02em;
      margin: 0 0 4px;
    }
    h1 {
      font-size: 34px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .apps { display: grid; gap: 12px; }
    .app {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    .app img {
      flex: none;
      width: 60px;
      height: 60px;
      border-radius: 13px;
      border: 1px solid var(--border);
    }
    h2 {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.3;
      margin: 2px 0 8px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 20px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    a {
      color: var(--link);
      font-weight: 500;
      text-decoration: none;
    }
    a:hover, a:focus-visible { text-decoration: underline; }
    footer {
      color: var(--muted);
      font-size: 14px;
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <picture>
        <source srcset="assets/fblogo-dark.svg" media="(prefers-color-scheme: dark)">
        <img class="logo" src="assets/fblogo.svg" alt="Logo di Francesco Barsotti">
      </picture>
      <p class="eyebrow">Francesco Barsotti</p>
      <h1>App</h1>
    </header>
    <div class="apps">
      <article class="app">
        <img src="risuscito/icon.png" alt="" width="60" height="60">
        <div>
          <h2>Risuscitò - Canti del Cammino</h2>
          <ul class="links">
            <li><a href="risuscito/privacy/">Privacy Policy</a></li>
          </ul>
        </div>
      </article>
    </div>
    <footer>© Francesco Barsotti</footer>
  </main>
</body>
</html>
