<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App · Francesco Barsotti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #964946;
      --bg: #F0F3F4;
      --card: #FFFFFF;
      --text: #1C1C1E;
      --muted: #6B6B70;
      --border: rgba(0, 0, 0, 0.08);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #C9716D;
        --bg: #000000;
        --card: #1C1C1E;
        --text: #F2F2F7;
        --muted: #A1A1A6;
        --border: rgba(255, 255, 255, 0.1);
      }
    }
    * { box-sizing: border-box; }
    h1, h2, .app, li strong {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 16px 64px;
    }
    .app {
      color: var(--primary);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.02em;
      margin: 0 0 8px;
    }
    h1 {
      font-size: 34px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 32px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 24px;
    }
    section { padding: 16px 0; }
    section + section { border-top: 1px solid var(--border); }
    h2 {
      font-size: 19px;
      font-weight: 600;
      margin: 0 0 4px;
    }
    p { margin: 0; }
    a { color: var(--primary); font-weight: 500; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 16px 0; }
    li + li { border-top: 1px solid var(--border); }
    li strong { display: block; font-size: 19px; font-weight: 600; }
    footer {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <main>
    <p class="app">Francesco Barsotti</p>
    <h1>App</h1>
    <div class="card">
      <ul>
        <li>
          <strong>Risuscitò - Canti del Cammino</strong>
          <a href="risuscito/privacy/">Privacy Policy</a>
        </li>
      </ul>
    </div>
  </main>
</body>
</html>
